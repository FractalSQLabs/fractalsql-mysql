# sonar-project.properties: fractalsql-mysql
sonar.projectKey=mysql_fractalsql
sonar.projectName=fractalsql-mysql

# Suppressed rules for intentional test-fixture patterns the test
# harness exercises by design. Rule keys are best-guess: if a finding
# reappears on scan, take the exact key from its issue page.
sonar.issue.ignore.multicriteria=e3,e5,e6,e7,e10,e12,e13,e14,e15,e17,e18,e20,e21
sonar.issue.ignore.multicriteria.e3.ruleKey=S1192
sonar.issue.ignore.multicriteria.e3.resourceKey=demo/**/*.sql
sonar.issue.ignore.multicriteria.e5.ruleKey=S125
sonar.issue.ignore.multicriteria.e5.resourceKey=demo/**/*.sql
sonar.issue.ignore.multicriteria.e6.ruleKey=S125
sonar.issue.ignore.multicriteria.e6.resourceKey=sql/install_udf.sql
sonar.issue.ignore.multicriteria.e7.ruleKey=S125
sonar.issue.ignore.multicriteria.e7.resourceKey=sql/install_agents.sql
sonar.issue.ignore.multicriteria.e10.ruleKey=S995
sonar.issue.ignore.multicriteria.e10.resourceKey=src/*.c
sonar.issue.ignore.multicriteria.e12.ruleKey=S2259
sonar.issue.ignore.multicriteria.e12.resourceKey=tests/evil_crash_*.c
sonar.issue.ignore.multicriteria.e13.ruleKey=S5443
sonar.issue.ignore.multicriteria.e13.resourceKey=tests/evil_*.c
sonar.issue.ignore.multicriteria.e14.ruleKey=S5332
sonar.issue.ignore.multicriteria.e14.resourceKey=scripts/easy_install.sh
sonar.issue.ignore.multicriteria.e15.ruleKey=S5332
sonar.issue.ignore.multicriteria.e15.resourceKey=demo/demo-workload.sh
sonar.issue.ignore.multicriteria.e17.ruleKey=S108
sonar.issue.ignore.multicriteria.e17.resourceKey=**/*.ps1
sonar.issue.ignore.multicriteria.e18.ruleKey=S8677
sonar.issue.ignore.multicriteria.e18.resourceKey=**/*.ps1
sonar.issue.ignore.multicriteria.e20.ruleKey=S2245
sonar.issue.ignore.multicriteria.e20.resourceKey=bench/tester/scout_test.js
sonar.issue.ignore.multicriteria.e21.ruleKey=S5332
sonar.issue.ignore.multicriteria.e21.resourceKey=scripts/ci/mock_llm.py

# Exclude confidence-harness output (timestamped per-run JSON + logs,
# regenerated every build; not source).
sonar.exclusions=**/scripts/confidence/out/**, **/dist/**, **/build/**, **/node_modules/**

# Test source roots: pointed at existing test trees where present.
# Harmless when absent; SonarQube ignores missing paths.
sonar.tests=tests